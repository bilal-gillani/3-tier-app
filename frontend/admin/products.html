<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products — LuxeStore Admin</title>
    <meta name="description" content="Add, edit and manage products in your LuxeStore.">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        (function() {
            const saved = localStorage.getItem('luxestore-theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        })();
    </script>
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-section">Main</div>
        <a href="/admin/dashboard.html" class="sidebar-item" data-page="dashboard">
            <span class="sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span> Dashboard
        </a>
        <div class="sidebar-section">Catalog</div>
        <a href="/admin/products.html" class="sidebar-item" data-page="products">
            <span class="sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span> Products
        </a>
        <a href="/admin/categories.html" class="sidebar-item" data-page="categories">
            <span class="sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg></span> Categories
        </a>
        <div class="sidebar-section">Sales</div>
        <a href="/admin/orders.html" class="sidebar-item" data-page="orders">
            <span class="sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span> Orders
        </a>
        <div class="sidebar-section">Store</div>
        <a href="/index.html" class="sidebar-item">
            <span class="sidebar-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/></svg></span> View Store
        </a>
    </aside>

    <main class="admin-content">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:14px;">
            <div>
                <h1 style="font-size:1.6rem;margin-bottom:4px;">Products</h1>
                <p class="text-secondary text-sm">Manage your product catalog</p>
            </div>
            <button class="btn btn-primary" onclick="openAddModal()">+ Add Product</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Featured</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products-tbody">
                    <tr><td colspan="7"><div class="loading-overlay"><div class="spinner"></div></div></td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Add/Edit Product Modal -->
<div class="modal-overlay" id="product-modal">
    <div class="modal modal-lg">
        <div class="modal-header">
            <h3 class="modal-title" id="modal-title">Add New Product</h3>
            <button class="modal-close-btn" onclick="Modal.close('product-modal')">✕</button>
        </div>
        <form id="prod-form">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="prod-name">Product Name <span>*</span></label>
                    <input class="form-control" type="text" id="prod-name" placeholder="e.g. Wireless Headphones Pro" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="prod-category">Category</label>
                        <select class="form-control" id="prod-category">
                            <option value="">— Select Category —</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="prod-price">Price ($) <span>*</span></label>
                        <input class="form-control" type="number" id="prod-price" step="0.01" min="0" placeholder="0.00" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="prod-stock">Stock Quantity</label>
                        <input class="form-control" type="number" id="prod-stock" min="0" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="prod-image">Image URL</label>
                        <input class="form-control" type="url" id="prod-image" placeholder="https://…">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="prod-description">Description</label>
                    <textarea class="form-control" id="prod-description" rows="4"
                        placeholder="Describe this product…"></textarea>
                </div>
                <label class="checkbox-group">
                    <input type="checkbox" id="prod-featured">
                    <span class="form-label" style="margin:0;">Mark as Featured</span>
                </label>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="Modal.close('product-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary" id="save-product-btn">Save Product</button>
            </div>
        </form>
    </div>
</div>

<footer class="footer" id="footer"></footer>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/admin/products.js"></script>
</body>
</html>
