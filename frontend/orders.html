<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — LuxeStore</title>
    <meta name="description" content="Track your LuxeStore orders and view order history.">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        (function() {
            const t = localStorage.getItem('luxestore-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="container">
    <div class="page-header">
        <div class="breadcrumb">
            <a href="/index.html">Home</a>
            <span class="breadcrumb-sep">›</span>
            <span>My Orders</span>
        </div>
        <h1>My Orders</h1>
        <p class="text-secondary" style="margin-top:4px;">Review your purchases and track shipments</p>
    </div>

    <div id="orders-list" style="display:flex;flex-direction:column;gap:12px;">
        <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
</div>

<!-- Order Detail Modal -->
<div class="modal-overlay" id="order-detail-overlay">
    <div class="modal modal-lg">
        <div class="modal-header">
            <h3 class="modal-title">Order Details</h3>
            <button class="modal-close-btn" onclick="Modal.close('order-detail-overlay')">✕</button>
        </div>
        <div class="modal-body" id="order-detail-body">
            <div class="loading-overlay"><div class="spinner"></div></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="Modal.close('order-detail-overlay')">Close</button>
        </div>
    </div>
</div>

<footer class="footer" id="footer"></footer>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/orders.js"></script>
</body>
</html>
