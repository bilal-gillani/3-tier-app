<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart — LuxeStore</title>
    <meta name="description" content="Review your shopping cart and proceed to checkout.">
    <link rel="stylesheet" href="/css/style.css">
    <script>
        (function() {
            const t = localStorage.getItem('luxestore-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="container">
    <div class="page-header">
        <div class="breadcrumb">
            <a href="/index.html">Home</a>
            <span class="breadcrumb-sep">›</span>
            <span>Shopping Cart</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
            <h1>Shopping Cart</h1>
            <button class="btn btn-secondary btn-sm" onclick="clearCart()" style="color:var(--danger);">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                Clear Cart
            </button>
        </div>
    </div>

    <div class="cart-layout">
        <!-- Cart Items -->
        <div id="cart-list">
            <div class="loading-overlay"><div class="spinner"></div></div>
        </div>

        <!-- Order Summary Sidebar -->
        <div id="cart-summary" class="hidden">
            <div class="order-summary">
                <h3 style="margin-bottom:20px;">Order Summary</h3>

                <div class="summary-line">
                    <span>Items (<span id="summary-items">0</span>)</span>
                    <span id="summary-subtotal">$0.00</span>
                </div>
                <div class="summary-line">
                    <span>Shipping</span>
                    <span id="summary-shipping" style="color:var(--success);font-weight:600;">Complimentary</span>
                </div>
                <div class="summary-line total">
                    <span>Total</span>
                    <span id="summary-total">$0.00</span>
                </div>

                <a href="/checkout.html" id="checkout-btn"
                    class="btn btn-primary btn-full btn-lg" style="margin-top:20px;">
                    Proceed to Checkout →
                </a>
                <a href="/index.html" class="btn btn-ghost btn-full" style="margin-top:8px;">
                    ← Continue Shopping
                </a>

                <div style="margin-top:20px;padding:14px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);text-align:center;">
                    <div style="display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text-muted);margin-bottom:4px;">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <span style="font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;">Bank-Grade Security</span>
                    </div>
                    <div class="text-xs text-muted">256-bit SSL encrypted checkout</div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer" id="footer"></footer>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
